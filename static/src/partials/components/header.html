<!-- Header -->
<header class="h-16 bg-white/80 dark:bg-gray-800/80 backdrop-blur-lg shadow-sm fixed top-0 left-0 right-0 z-40 border-b border-gray-200/50 dark:border-gray-700/50">
  <div class="h-full px-4 flex items-center justify-between">
    <!-- Left: Logo & Toggle -->
    <div class="flex items-center gap-4">
      <button @click="$store.app.toggleSidebar()" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
        <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-700 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/25">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
        </div>
        <div>
          <span class="text-xl font-bold text-gray-900 dark:text-white">ANPR</span>
          <span class="hidden sm:inline text-xs text-gray-500 dark:text-gray-400 ml-2">Plate Recognition</span>
        </div>
      </div>
    </div>

    <!-- Right: Status & Dark Mode -->
    <div class="flex items-center gap-3">
      <!-- API Status -->
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full" 
           :class="$store.app.isOnline ? 'bg-green-100 dark:bg-green-900/30' : 'bg-red-100 dark:bg-red-900/30'">
        <div class="status-dot" :class="$store.app.isOnline ? 'status-online' : 'status-offline'"></div>
        <span class="text-sm font-medium" 
              :class="$store.app.isOnline ? 'text-green-700 dark:text-green-300' : 'text-red-700 dark:text-red-300'"
              x-text="$store.app.isOnline ? 'Online' : 'Offline'"></span>
      </div>

      <!-- Dark Mode Toggle -->
      <button @click="$store.app.toggleDarkMode()" 
              class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-all duration-200">
        <svg x-show="!$store.app.darkMode" class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg x-show="$store.app.darkMode" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </button>
    </div>
  </div>
</header>
