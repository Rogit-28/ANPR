<!-- Toast Notifications -->
<div class="toast" x-show="$store.app.toasts.length > 0">
  <template x-for="toast in $store.app.toasts" :key="toast.id">
    <!-- Rich Alert Toast (for detection alerts) -->
    <template x-if="toast.isRichAlert">
      <div class="toast-item"
           :class="toast.isWatchlist ? 'toast-alert-watchlist' : 'toast-alert-detection'"
           x-show="toast.visible"
           x-transition:enter="transition ease-out duration-300"
           x-transition:leave="transition ease-in duration-200">
        <!-- Alert Icon -->
        <div class="flex-shrink-0">
          <div class="w-10 h-10 rounded-full flex items-center justify-center"
               :class="toast.isWatchlist ? 'bg-red-100 dark:bg-red-900/50' : 'bg-blue-100 dark:bg-blue-900/50'">
            <svg x-show="toast.isWatchlist" class="w-5 h-5 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <svg x-show="!toast.isWatchlist" class="w-5 h-5 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </div>
        </div>
        <!-- Alert Content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-bold text-xs uppercase tracking-wider"
                  :class="toast.isWatchlist ? 'text-red-700 dark:text-red-300' : 'text-blue-700 dark:text-blue-300'"
                  x-text="toast.isWatchlist ? 'WATCHLIST MATCH' : 'PLATE DETECTED'"></span>
            <span class="text-xs text-gray-500" x-text="toast.time"></span>
          </div>
          <div class="flex items-center gap-2">
            <span class="plate-text text-sm" x-text="toast.plate"></span>
            <span x-show="toast.confidence" class="badge badge-sm"
                  :class="parseInt(toast.confidence) >= 90 ? 'badge-success' : (parseInt(toast.confidence) >= 70 ? 'badge-warning' : 'badge-danger')"
                  x-text="toast.confidence + '%'"></span>
          </div>
        </div>
        <!-- Close Button -->
        <button @click="$store.app.removeToast(toast.id)" class="flex-shrink-0 p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-400 hover:text-gray-600 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </template>
    <!-- Standard Toast (for other messages) -->
    <template x-if="!toast.isRichAlert">
      <div class="toast-item" :class="`toast-${toast.type}`"
           x-show="toast.visible"
           x-transition:enter="transition ease-out duration-300"
           x-transition:leave="transition ease-in duration-200">
        <div class="flex-1">
          <p class="font-medium" x-text="toast.message"></p>
        </div>
        <button @click="$store.app.removeToast(toast.id)" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </template>
  </template>
</div>
